{% extends "base.html" %}

{% block title %}Analytics — Spendly{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="analytics-card">
        <div class="analytics-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        </div>

        <span class="analytics-badge">Coming Soon</span>

        <h1 class="analytics-title">Advanced Analytics</h1>

        <p class="analytics-subtitle">We're working on powerful insights and visualisations to help you understand your spending patterns better.</p>

        <div class="analytics-dots">
            <span class="analytics-dot"></span>
            <span class="analytics-dot"></span>
            <span class="analytics-dot"></span>
        </div>

        <p class="analytics-caption">We're crafting something special</p>
    </div>
</section>
{% endblock %}
